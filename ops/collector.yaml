extensions:
  health_check:
    endpoint: 127.0.0.1:23133
  file_storage:
    directory: ${env:LAB_RUNTIME}/otel-queue
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:24318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlphttp/loki:
    endpoint: http://127.0.0.1:33100/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
  otlp/tempo:
    endpoint: 127.0.0.1:34317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage
service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

global:
  resolve_timeout: 30s
route:
  receiver: fleet-audit
  group_by: [alertname, tenant]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  routes:
    - matchers: ['tenant="bravo"']
      receiver: bravo-audit
receivers:
  - name: fleet-audit
    webhook_configs:
      - url: http://127.0.0.1:8790/api/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: alpha-operator-demo
  - name: bravo-audit
    webhook_configs:
      - url: http://127.0.0.1:8790/api/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: bravo-operator-demo

global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: fleetlab
    static_configs:
      - targets: ['127.0.0.1:8790']
    authorization:
      type: Bearer
      credentials: metrics-admin-demo
remote_write:
  - url: http://127.0.0.1:39009/api/v1/push
rule_files:
  - alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:39093']

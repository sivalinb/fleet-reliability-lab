auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  grpc_listen_address: 127.0.0.1
  http_listen_port: 33100
  grpc_listen_port: 39096
common:
  instance_addr: 127.0.0.1
  path_prefix: ${LAB_RUNTIME}/loki
  storage:
    filesystem:
      chunks_directory: ${LAB_RUNTIME}/loki/chunks
      rules_directory: ${LAB_RUNTIME}/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  volume_enabled: true
analytics:
  reporting_enabled: false
